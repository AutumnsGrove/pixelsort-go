name: ci
on:
  push:
    branches: [main, 'build/**']
  pull_request:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm --dir worker install --frozen-lockfile
      - run: pnpm --dir worker check
      - run: pnpm --dir worker test
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Format, vet, lint, fast tests
        run: make check
      - name: Tests with the race detector
        run: make test
      - name: Fuzz every target briefly
        run: make fuzz FUZZTIME=10s
      - name: Engine tests under WebAssembly
        run: make wasm-test
      - name: WASM hello under Node
        run: make hello
      - name: WASM output equals the native goldens
        run: node web/scripts/wasm-golden.mjs
      - name: Deploy scripts (watcher, install, backup, Meridian snippets, compose)
        run: make deploy-test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: make wasm
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web check
      - run: pnpm --dir web lint
      - run: pnpm --dir web test
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: make e2e
