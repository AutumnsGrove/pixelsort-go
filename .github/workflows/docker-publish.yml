# Publishes the image to GHCR when CI passes on main. The file name matters: Ivy's updater waits on `docker-publish.yml`.
name: docker-publish
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # On a workflow_run, only when CI succeeded; tags and manual runs always go.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version needs the commit count
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Compute the version
        id: v
        run: echo "version=r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          tags="ghcr.io/autumnsgrove/pixelsort:latest,ghcr.io/autumnsgrove/pixelsort:$(git rev-parse --short HEAD)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tags="$tags,ghcr.io/autumnsgrove/pixelsort:${GITHUB_REF_NAME}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
