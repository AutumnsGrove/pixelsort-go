version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - revive
    - misspell
    - errorlint
    - copyloopvar
    - unparam
    - nilerr
    - gocritic
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, unparam]
      # internal/testutil is test support, never shipped: reading and writing golden files by name is its job.
      - path: ^internal/testutil/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
